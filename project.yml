name: Fingertip
options:
  bundleIdPrefix: com.sorrycc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  AgentCore:
    path: Packages/AgentCore
targets:
  Fingertip:
    type: application
    platform: iOS
    sources:
      - path: App
      # TouchSynthesis core (git submodule): lockdown, DTX, testmanagerd, XCTest touch synthesis, idevice tunnel.
      # Its App/ and RemoteControl/ folders are replaced by ours.
      - path: vendor/TouchSynthesis/TouchSynthesis
        excludes:
          - "App/**"
          - "RemoteControl/**"
          - "Info.plist"
          - "TouchSynthesis.entitlements"
          - "TouchSynthesis-Bridging-Header.h"
          - "idevice/**"   # forked into App/Automation/IdeviceTunnel.m (RemotePairing); FFI from build/idevice
    dependencies:
      - package: AgentCore
    settings:
      base:
        PRODUCT_NAME: Fingertip
        PRODUCT_BUNDLE_IDENTIFIER: com.sorrycc.fingertip
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Fingertip.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: App/Resources/Fingertip-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/build/idevice"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/build/idevice"
          - "$(PROJECT_DIR)/vendor/TouchSynthesis/TouchSynthesis/TouchSynthesizer"
          - "$(PROJECT_DIR)/App/Automation"
        # XCTest on the DDI links @rpath/Testing.framework (Swift Testing); let dyld find it like a test runner would.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "/System/Developer/Library/Frameworks"
          - "/System/Developer/Library/PrivateFrameworks"
          - "/System/Developer/usr/lib"
        OTHER_LDFLAGS:
          - "-lidevice_ffi"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework Network"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Simulator-only UI build with scripted data (Previews/Mocks.swift), for design work without a phone:
  #   xcodebuild -scheme FingertipPreview -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  FingertipPreview:
    type: application
    platform: iOS
    sources:
      - App/UI
      - App/Agent/AgentSettings.swift
      - App/Automation/AutomationPhase.swift
      - App/Resources/Assets.xcassets
      - vendor/TouchSynthesis/TouchSynthesis/Util/Logger.swift
      - Previews
    dependencies:
      - package: AgentCore
    info:
      path: build/PreviewInfo.plist
      properties:
        CFBundleDisplayName: Fingertip Preview
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sorrycc.fingertip.preview
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
